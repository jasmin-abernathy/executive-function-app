name: Signed Android beta and Play bundle (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm_signed_beta:
        description: "Build signed APK/AAB for later testing, never upload to Google automatically"
        type: boolean
        required: true
        default: false
      confirm_companion_integrated:
        description: "Confirm the official companion is integrated and ready for release testing"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: tdah-signed-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-beta:
    if: github.ref == 'refs/heads/main' && inputs.confirm_signed_beta && inputs.confirm_companion_integrated
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key from protected secret
        shell: bash
        env:
          TDAH_BETA_KEYSTORE_BASE64: ${{ secrets.TDAH_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TDAH_BETA_KEYSTORE_BASE64" || { echo "Signing key secret missing"; exit 1; }
          STORE_PATH="$RUNNER_TEMP/tdah-beta-signing.jks"
          printf '%s' "$TDAH_BETA_KEYSTORE_BASE64" | base64 --decode > "$STORE_PATH"
          test -s "$STORE_PATH"
          chmod 600 "$STORE_PATH"
          echo "TDAH_BETA_STORE_FILE=$STORE_PATH" >> "$GITHUB_ENV"

      - name: Test, lint, assemble release APK and Play App Bundle
        shell: bash
        env:
          TDAH_BETA_STORE_PASSWORD: ${{ secrets.TDAH_BETA_STORE_PASSWORD }}
          TDAH_BETA_KEY_ALIAS: ${{ secrets.TDAH_BETA_KEY_ALIAS }}
          TDAH_BETA_KEY_PASSWORD: ${{ secrets.TDAH_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TDAH_BETA_STORE_PASSWORD" || { echo "Store password missing"; exit 1; }
          test -n "$TDAH_BETA_KEY_ALIAS" || { echo "Key alias missing"; exit 1; }
          test -n "$TDAH_BETA_KEY_PASSWORD" || { echo "Key password missing"; exit 1; }
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed APK, signed AAB and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # An Android upload certificate is self-signed: -strict rejects expected CA warnings.
          jarsigner -verify "$AAB"
          sha256sum "$APK" > "$APK.sha256"
          sha256sum "$AAB" > "$AAB.sha256"

      - name: Save signed files to GitHub only (no Google Play API access)
        uses: actions/upload-artifact@v7
        with:
          name: executive-function-beta-signed-apk-and-play-aab
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/tdah-beta-signing.jks"
