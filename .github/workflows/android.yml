name: Android

on:
  # Heavy Android builds are opt-in on branches. Normal pushes to main do not
  # compile an APK; use Run workflow when an installable build is actually needed.
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Generate an APK only when explicitly requested"
        type: boolean
        default: false
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and lint (no APK)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failure-report
          path: app/build/test-results/testDebugUnitTest/
      - name: Assemble APK on explicit request only
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'pull_request' && github.head_ref == 'work/adhd-lockscreen-pip-20260924')
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk) || (github.event_name == 'pull_request' && github.head_ref == 'work/adhd-lockscreen-pip-20260924')
        with:
          name: executive-function-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
