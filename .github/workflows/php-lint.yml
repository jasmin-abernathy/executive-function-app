name: PHP lint

on:
  push:
    paths:
      - 'web/app.lepotager.org/**/*.php'
      - 'web/app.lepotager.org/resosoin/**'
      - 'tests/resosoin-*.test.*'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'web/app.lepotager.org/**/*.php'
      - 'web/app.lepotager.org/resosoin/**'
      - 'tests/resosoin-*.test.*'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find web/app.lepotager.org \
            -type f \
            -name '*.php' \
            -print0 \
            | xargs -0 -n1 php -l

      - name: Validate RésoSoin survey
        shell: bash
        run: |
          set -euo pipefail
          php web/app.lepotager.org/resosoin/questionnaire/validate.php
          php -r 'json_decode(file_get_contents("web/app.lepotager.org/resosoin/questionnaire/questions.json"), true, 512, JSON_THROW_ON_ERROR);'
          node --check web/app.lepotager.org/resosoin/questionnaire/assets/survey-core.js
          node --check web/app.lepotager.org/resosoin/questionnaire/assets/survey.js
          node tests/resosoin-survey-core.test.js
          php tests/resosoin-rpps-verification.test.php

      - name: Shared Stancer contribution contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "/home/sc1leja3715/stancer-private/private/stancer-config.php" web/app.lepotager.org/soutenir/stancer-contribution.php
          grep -Fq "payment.stancer.com" web/app.lepotager.org/soutenir/paiement.php
          grep -Fq 'placeholder="1"' web/app.lepotager.org/soutenir/index.html
          ! grep -RInE 's(test|prod)_[A-Za-z0-9]{20,}' web/app.lepotager.org/soutenir
