name: Feature request / Proposition d’amélioration
about: Suggest an improvement or a new check / Proposer une amélioration ou un nouveau contrôle
title: "[Idea / Idée] "
labels: []
body:
  - type: textarea
    id: need
    attributes:
      label: Need or problem / Besoin ou problème rencontré
      description: Describe the use case before the proposed solution. / Expliquez le cas d’usage avant la solution souhaitée.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / Proposition
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or relevant plugins / Exemples ou extensions concernées
      description: Optional / Facultatif
